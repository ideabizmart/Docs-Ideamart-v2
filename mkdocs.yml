
site_name: Ideamart Documentation
site_description: Official Developer Documentation for Ideamart
site_url: https://docs.ideamart.io/
repo_url: https://portal.ideamart.io
repo_name: Portal Login

nav:
  - Home: index.md

  - IdeaPro Tutorials:
      - Provisioning: ideapro-tutorials/ideapro-provisioning.md
      - SMS API: ideapro-tutorials/sms-api-provisioning.md
      - Charging API: ideapro-tutorials/charging-api.md

  - Developer Docs:
      - Charging API: developer-docs/charging-api.md
      - SMS API: developer-docs/sms-api.md
      - Subscription API: developer-docs/subscription-api.md
      - USSD API: developer-docs/ussd-api.md
      - OTP API: developer-docs/otp-api.md
      - LBS API: developer-docs/lbs-api.md
      - Response Codes: developer-docs/response-codes.md
      - MCP Integration:
          - Common Guide: MCP/guide-common.md
          - Ideamart Guide: MCP/guide-ideamart.md
          - Client Configuration: MCP/mcp-client-config.md
          - Troubleshooting: MCP/troubleshooting.md

  - IdeaApp Tutorials:
      - IdeaApp Introduction: ideaapp-tutorials/introduction.md
      - IdeaApp Services: ideaapp-tutorials/services.md
      - IdeaApp Alert: ideaapp-tutorials/alert.md
      - IdeaApp Contact: ideaapp-tutorials/contact.md
      - IdeaApp Voting: ideaapp-tutorials/voting.md

  - Video Tutorials: video-tutorials.md
  - OMNI AI: omni-ai.md
  - FAQ: faq.md
  - Help/Contact Us: help.md
  - Skill: skills.md

theme:
  name: material
  logo: images/logo.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

  icon:
    repo: fontawesome/solid/right-to-bracket

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: Roboto Mono

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.extra
  - attr_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ideamart-chatbot.js

extra:
  generator: false

  analytics:
    provider: google
    property: G-SCWBS5Y3CJ

  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@IdeaMartLK777
